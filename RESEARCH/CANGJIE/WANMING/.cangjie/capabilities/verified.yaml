  },
  "entry": {
    "name": "wanming",
    "description": "基于《晚明》原始 EPUB 蒸馏的历史长篇叙事方法入口，用于组织成长、独立世界、生活层、重大事件、制度移植与史料一致性等写作任务。",
    "core_principles": [
      "规模扩大时让旧解法暴露瓶颈，再产生新的组织结构。",
      "主角能力必须经由身份、资源、岗位和组织逐级转化为行动力。",
      "世界会对主角成功作出二阶反应，对手、盟友和基层都要重新估价。",
      "宏观变化必须穿透到普通人的生活、家庭和长期成本。",
      "制度与现代知识只能在已知条件内试点，未知处必须保留未知。",
      "重大事件用有限信息、多位置行动和事后结算维持真实因果。"
    ],
    "out_of_scope": [
      "不把小说中的具体武器、战术、军工参数或伤害细节编译成现实操作指南。",
      "不把人物观点自动当成作者方法，也不把缺乏来源的常识补进《晚明》能力。",
      "不把本 Bundle 自动写入 V10 Runtime 或 Canon。"
    ],
    "stop_conditions": [
      "任务要求超出《晚明》来源可支持范围时停止归因并标记来源不足。",
      "遇到 needs_review 的 WM-T14 说明量阈值或成熟组织机器感问题时，不把它伪装成已验证能力。"
    ]
  },
  "router_entry": {
    "name": "wanming-router",
    "description": "当用户希望应用《晚明》的整体方法、请求同时跨越多个能力，或没有命中独立晋级 Skill 时，由此入口路由到完整能力卡。"
  },
